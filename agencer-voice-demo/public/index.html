<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agencer - Voice AI Assistant</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header>
      <h1>Agencer</h1>
      <p class="subtitle">Voice-First AI Orchestration</p>
    </header>

    <main>
      <div class="conversation" id="conversation">
        <div class="message assistant">
          <div class="message-content">
            Click the microphone below to start talking with Agencer.
          </div>
        </div>
      </div>

      <div class="controls">
        <div class="status" id="status">Ready</div>

        <button class="mic-button" id="micButton" aria-label="Toggle microphone">
          <svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
          <div class="pulse-ring"></div>
        </button>

        <button class="reset-button" id="resetButton" aria-label="Reset conversation">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
          </svg>
          New Chat
        </button>
      </div>
    </main>

    <footer>
      <p>Powered by Claude Opus 4.5 & ElevenLabs</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
