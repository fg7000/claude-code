<!DOCTYPE html>
<!--

  =====================================================

  A luminous, conscious AI avatar visualization with:
  - Waveform ring that visualizes audio as waves ON the circle
  - Particles that preserve exact colors from your logo
  - 3D depth consciousness effect (shimmer, drift, breathing)
  - Smooth audio reactivity with frequency-based responses

  The feeling: warm, intimate, aware. Like encountering a presence.
-->
<html lang="en">

    }

    /* Film grain overlay */

      position: fixed;
      top: 0;

  <!-- Three.js via CDN -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

    // ============================================
    // CONFIGURATION
    // ============================================

    const CONFIG = {
      particleCount: 20000,
      particleSize: 0.6,
      breathingIntensity: 0.3,
      depthIntensity: 0.5,
      waveAmplitude: 50,
      audioSensitivity: 1.0,
      bloomStrength: 0.15
    };

    const DEFAULTS = { ...CONFIG };

    // ============================================
    // STATE
    // ============================================

    let scene, camera, renderer, composer, bloomPass;
    let particles, particleGeometry, particleMaterial;
    let ringLine, ringGeometry, ringMaterial;
    let audioContext, micAnalyser, trackAnalyser;
    let micStream, micSource;
    let micEnabled = false, trackPlaying = false;
    let micData, trackData;
    let smoothedMicLevel = 0, smoothedTrackLevel = 0;
    let smoothedMicFFT = null, smoothedTrackFFT = null;
    let clock, time = 0;
    let logoParticleData = [];
    let frameCount = 0, lastFpsTime = 0;
    let lastPulseFactor = 1;

    const RING_SEGMENTS = 256;
    const RING_BASE_RADIUS = 1.1;

    // ============================================
    // LOGO PARSING - EXACT COLOR SAMPLING
    // ============================================

    const LOGO_URL = 'agencer-logo.png';

    async function parseLogoImage(imageSource) {
      return new Promise((resolve) => {
        const sourceToTry = imageSource || LOGO_URL;

        if (!sourceToTry) {
          console.log('No logo source, using procedural generation');
          resolve(generateProceduralLogoData());
          return;
        }

        const img = new Image();
        img.crossOrigin = 'anonymous';

        img.onload = () => {
          console.log('Logo loaded, sampling colors...');
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');

          // Use full resolution for better color sampling
          const size = Math.min(img.width, img.height, 512);
          canvas.width = size;
          canvas.height = size;

          const scale = size / Math.max(img.width, img.height);
          const w = img.width * scale;
          const h = img.height * scale;
          const x = (size - w) / 2;
          const y = (size - h) / 2;

          ctx.drawImage(img, x, y, w, h);
          const imageData = ctx.getImageData(0, 0, size, size);
          const pixels = imageData.data;

          const candidates = [];
          const centerX = size / 2;
          const centerY = size / 2;

          // Sample ALL non-transparent pixels with their EXACT colors
          for (let py = 0; py < size; py++) {
            for (let px = 0; px < size; px++) {
              const i = (py * size + px) * 4;
              const r = pixels[i];
              const g = pixels[i + 1];
              const b = pixels[i + 2];
              const a = pixels[i + 3];

              // Skip transparent pixels
              if (a < 50) continue;

              // Position relative to center, normalized to -1 to 1
              const nx = (px - centerX) / centerX;
              const ny = (centerY - py) / centerY;

              candidates.push({
                x: nx,
                y: ny,
                // EXACT colors from the image - this is critical!
                r: r / 255,
                g: g / 255,
                b: b / 255,
                // Store for animation
                phase: Math.random() * Math.PI * 2
              });
            }
          }

          // Shuffle and sample
          const shuffled = candidates.sort(() => Math.random() - 0.5);
          const result = shuffled.slice(0, CONFIG.particleCount);

          console.log(`Sampled ${result.length} particles with exact colors from ${candidates.length} pixels`);
          resolve(result);
        };

        img.onerror = () => {
          console.log('Could not load logo, using procedural generation');
          resolve(generateProceduralLogoData());
        };

        img.src = sourceToTry;
      });
    }

    function generateProceduralLogoData() {
      // Generate colorful spiral matching Agencer aesthetic
      const particles = [];
      const count = CONFIG.particleCount;

      const colorStops = [
        { angle: 0, color: [0.9, 0.2, 0.6] },
        { angle: 60, color: [1.0, 0.3, 0.3] },
        { angle: 120, color: [1.0, 0.6, 0.1] },
        { angle: 180, color: [0.9, 0.9, 0.2] },
        { angle: 240, color: [0.3, 0.9, 0.4] },
        { angle: 300, color: [0.2, 0.8, 0.9] },
        { angle: 360, color: [0.9, 0.2, 0.6] }
      ];

      function getColorAtAngle(angle) {
        angle = ((angle % 360) + 360) % 360;
        for (let i = 0; i < colorStops.length - 1; i++) {
          if (angle >= colorStops[i].angle && angle < colorStops[i + 1].angle) {
            const t = (angle - colorStops[i].angle) / (colorStops[i + 1].angle - colorStops[i].angle);
            return [
              colorStops[i].color[0] + (colorStops[i + 1].color[0] - colorStops[i].color[0]) * t,
              colorStops[i].color[1] + (colorStops[i + 1].color[1] - colorStops[i].color[1]) * t,
              colorStops[i].color[2] + (colorStops[i + 1].color[2] - colorStops[i].color[2]) * t
            ];
          }
        }
        return colorStops[0].color;
      }

      const arms = 8;
      const maxRadius = 0.85;

      for (let i = 0; i < count; i++) {
        const armIndex = i % arms;
        const armOffset = (armIndex / arms) * Math.PI * 2;
        const progress = Math.pow(Math.random(), 0.7);

        const baseAngle = progress * Math.PI * 4 + armOffset;
        const swirlAngle = baseAngle + progress * Math.PI * 2;
        const angleNoise = (Math.random() - 0.5) * 0.3;
        const radiusNoise = (Math.random() - 0.5) * 0.08;

        const finalAngle = swirlAngle + angleNoise;
        const finalRadius = progress * maxRadius + radiusNoise;

        const x = Math.cos(finalAngle) * finalRadius;
        const y = Math.sin(finalAngle) * finalRadius;

        const colorAngle = ((finalAngle * 180 / Math.PI) + 180) % 360;
        const [r, g, b] = getColorAtAngle(colorAngle);
        const brightness = 0.8 + Math.random() * 0.4;

        particles.push({
          x, y,
          r: Math.min(1, r * brightness),
          g: Math.min(1, g * brightness),
          b: Math.min(1, b * brightness),
          phase: Math.random() * Math.PI * 2
        });
      }

      return particles;
    }

    // ============================================
    // INITIALIZATION
    // ============================================

    async function init() {
      logoParticleData = await parseLogoImage(null);

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a0a0f);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 3;

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      document.getElementById('canvas-container').appendChild(renderer.domElement);

      createParticles();
      createRing();
      setupPostProcessing();
      setupAudio();
      setupControls();

      clock = new THREE.Clock();
      window.addEventListener('resize', onWindowResize);

      setTimeout(() => {
        document.getElementById('loading').classList.add('hidden');
      }, 500);

      animate();
    }

    // ============================================
    // PARTICLE SYSTEM - 3D CONSCIOUSNESS EFFECT
    // ============================================

    function createParticles() {
      const count = logoParticleData.length;
      particleGeometry = new THREE.BufferGeometry();

      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      const sizes = new Float32Array(count);
      const phases = new Float32Array(count);
      const homePositions = new Float32Array(count * 3);

      for (let i = 0; i < count; i++) {
        const p = logoParticleData[i];
        const i3 = i * 3;

        positions[i3] = p.x;
        positions[i3 + 1] = p.y;
        positions[i3 + 2] = 0;

        homePositions[i3] = p.x;
        homePositions[i3 + 1] = p.y;
        homePositions[i3 + 2] = 0;

        // EXACT colors from logo
        colors[i3] = p.r;
        colors[i3 + 1] = p.g;
        colors[i3 + 2] = p.b;

        sizes[i] = 0.5 + Math.random() * 0.5;
        phases[i] = p.phase || Math.random() * Math.PI * 2;
      }

      particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      particleGeometry.setAttribute('homePosition', new THREE.BufferAttribute(homePositions, 3));
      particleGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      particleGeometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
      particleGeometry.setAttribute('phase', new THREE.BufferAttribute(phases, 1));

      particleMaterial = new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 },
          uSize: { value: CONFIG.particleSize },
          uPixelRatio: { value: renderer.getPixelRatio() },
          uAudioLevel: { value: 0 },
          uBassLevel: { value: 0 },
          uBreathingIntensity: { value: CONFIG.breathingIntensity },
          uDepthIntensity: { value: CONFIG.depthIntensity },
          uPulseFactor: { value: 1 }
        },
        vertexShader: `
          uniform float uTime;
          uniform float uSize;
          uniform float uPixelRatio;
          uniform float uAudioLevel;
          uniform float uBassLevel;
          uniform float uBreathingIntensity;
          uniform float uDepthIntensity;
          uniform float uPulseFactor;

          attribute vec3 homePosition;
          attribute float size;
          attribute vec3 color;
          attribute float phase;

          varying vec3 vColor;
          varying float vBrightness;

          void main() {
            vec3 pos = homePosition;

            // 1. Gentle Z oscillation (depth shimmer) - creates "consciousness" effect
            float zOscillation = sin(uTime * 0.5 + phase) * 0.1 * uDepthIntensity;

            // 2. Audio-reactive Z push (particles "jump" toward camera on loud sounds)
            float audioPush = uAudioLevel * 0.2 * uDepthIntensity;

            pos.z = zOscillation + audioPush;

            // 3. Perspective based on Z (closer = bigger/brighter)
            float zScale = 1.0 + pos.z * 0.3;
            vBrightness = 1.0 + pos.z * 0.2;

            // 4. Gentle XY drift (organic floating feel)
            float driftX = sin(uTime * 0.3 + phase * 2.0) * 0.02 * uBreathingIntensity;
            float driftY = cos(uTime * 0.4 + phase * 3.0) * 0.02 * uBreathingIntensity;

            // 5. Bass pulse (particles push outward on bass)
            float pulse = uPulseFactor;

            pos.x = homePosition.x * pulse * zScale + driftX;
            pos.y = homePosition.y * pulse * zScale + driftY;

            // 6. Audio brightness boost
            vBrightness += uAudioLevel * 0.3;

            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
            gl_Position = projectionMatrix * mvPosition;

            // Size with depth perspective - smaller, cleaner particles
            float depthSize = zScale * (1.0 + uAudioLevel * 0.1);
            gl_PointSize = size * uSize * uPixelRatio * depthSize * (20.0 / -mvPosition.z);

            vColor = color;
          }
        `,
        fragmentShader: `
          varying vec3 vColor;
          varying float vBrightness;

          void main() {
            // Clean circular particle - no glow halo
            vec2 center = gl_PointCoord - vec2(0.5);
            float dist = length(center);

            // Sharp circular falloff
            float alpha = 1.0 - smoothstep(0.35, 0.5, dist);

            // Discard pixels outside circle
            if (dist > 0.5) discard;

            // Apply exact logo colors with subtle brightness modulation
            vec3 finalColor = vColor * min(vBrightness, 1.2);

            gl_FragColor = vec4(finalColor, alpha * 0.5);
          }
        `,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      particles = new THREE.Points(particleGeometry, particleMaterial);
      scene.add(particles);
    }

    // ============================================
    // RING WAVEFORM - FFT VISUALIZATION
    // ============================================

    function createRing() {
      ringGeometry = new THREE.BufferGeometry();

      const positions = new Float32Array(RING_SEGMENTS * 3);
      const colors = new Float32Array(RING_SEGMENTS * 3);

      // Color gradient for ring (yellow -> green -> cyan)
      const ringColors = [
        { t: 0, color: [0.9, 0.9, 0.2] },
        { t: 0.33, color: [0.3, 0.9, 0.4] },
        { t: 0.66, color: [0.2, 0.8, 0.9] },
        { t: 1, color: [0.9, 0.9, 0.2] }
      ];

      function getRingColor(t) {
        t = ((t % 1) + 1) % 1;
        for (let i = 0; i < ringColors.length - 1; i++) {
          if (t >= ringColors[i].t && t <= ringColors[i + 1].t) {
            const lt = (t - ringColors[i].t) / (ringColors[i + 1].t - ringColors[i].t);
            return [
              ringColors[i].color[0] + (ringColors[i + 1].color[0] - ringColors[i].color[0]) * lt,
              ringColors[i].color[1] + (ringColors[i + 1].color[1] - ringColors[i].color[1]) * lt,
              ringColors[i].color[2] + (ringColors[i + 1].color[2] - ringColors[i].color[2]) * lt
            ];
          }
        }
        return ringColors[0].color;
      }

      for (let i = 0; i < RING_SEGMENTS; i++) {
        const angle = (i / RING_SEGMENTS) * Math.PI * 2;
        const i3 = i * 3;

        positions[i3] = Math.cos(angle) * RING_BASE_RADIUS;
        positions[i3 + 1] = Math.sin(angle) * RING_BASE_RADIUS;
        positions[i3 + 2] = 0;

        const t = i / RING_SEGMENTS;
        const [r, g, b] = getRingColor(t);
        colors[i3] = r;
        colors[i3 + 1] = g;
        colors[i3 + 2] = b;
      }

      ringGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      ringGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      ringMaterial = new THREE.LineBasicMaterial({
        vertexColors: true,
        linewidth: 3,
        transparent: true,
        opacity: 1.0
      });

      ringLine = new THREE.LineLoop(ringGeometry, ringMaterial);
      scene.add(ringLine);
    }

    function updateRingWaveform() {
      const positions = ringGeometry.attributes.position.array;
      const fftData = smoothedMicFFT;
      // Wave amplitude: 0-100 slider maps to 0-0.3 world units
      const waveAmp = CONFIG.waveAmplitude / 100 * 0.3;

      // Check if we have real audio data
      let hasAudio = false;
      if (fftData) {
        for (let i = 0; i < fftData.length; i++) {
          if (fftData[i] > 0.1) {
            hasAudio = true;
            break;
          }
        }
      }

      for (let i = 0; i < RING_SEGMENTS; i++) {
        const angle = (i / RING_SEGMENTS) * Math.PI * 2;
        const i3 = i * 3;

        let displacement = 0;

        if (hasAudio && fftData) {
          // Map ring position to FFT bin
          const fftBin = Math.floor((i / RING_SEGMENTS) * fftData.length);
          const fftValue = fftData[fftBin] || 0;

          // Bipolar displacement: wave goes BOTH inward and outward from center
          // fftValue is 0-1, we want -0.5 to 0.5 range
          displacement = (fftValue - 0.5) * 2 * waveAmp * CONFIG.audioSensitivity;
        }

        // Idle wave (visible traveling wave when no audio)
        const idleWave = Math.sin(angle * 4 + time * 1.5) * 0.03 * CONFIG.breathingIntensity;
        const idleWave2 = Math.sin(angle * 2 - time * 0.8) * 0.015 * CONFIG.breathingIntensity;

        const radius = RING_BASE_RADIUS + displacement + idleWave + idleWave2;

        positions[i3] = Math.cos(angle) * radius;
        positions[i3 + 1] = Math.sin(angle) * radius;
      }

      ringGeometry.attributes.position.needsUpdate = true;
    }

    // ============================================
    // POST PROCESSING
    // ============================================

    function setupPostProcessing() {
      composer = new EffectComposer(renderer);
      composer.addPass(new RenderPass(scene, camera));

      bloomPass = new UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        CONFIG.bloomStrength,
        0.3,  // radius
        0.85  // threshold - higher means less glow
      );
      composer.addPass(bloomPass);
    }

    // ============================================
    // AUDIO SYSTEM
    // ============================================

    function setupAudio() {
      micData = new Uint8Array(128);
      trackData = new Uint8Array(128);
      smoothedMicFFT = new Float32Array(128);
      smoothedTrackFFT = new Float32Array(128);
    }

    async function enableMicrophone() {
      try {
        if (!audioContext) {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }

        if (audioContext.state === 'suspended') {
          await audioContext.resume();
        }

        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        micSource = audioContext.createMediaStreamSource(micStream);
        micAnalyser = audioContext.createAnalyser();
        micAnalyser.fftSize = 256;
        micAnalyser.smoothingTimeConstant = 0.8;
        micSource.connect(micAnalyser);

        micData = new Uint8Array(micAnalyser.frequencyBinCount);
        micEnabled = true;

        document.getElementById('mic-status').classList.add('active');
        document.getElementById('mic-status-text').textContent = 'Microphone: Active';
        document.getElementById('mic-btn').classList.add('active');
        document.getElementById('mic-btn').innerHTML = `
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
          </svg>
          Disable Microphone
        `;
      } catch (err) {
        console.error('Microphone access denied:', err);
        alert('Microphone access was denied.');
      }
    }

    function disableMicrophone() {
      if (micStream) {
        micStream.getTracks().forEach(track => track.stop());
      }
      if (micSource) {
        micSource.disconnect();
      }

      micEnabled = false;
      document.getElementById('mic-status').classList.remove('active');
      document.getElementById('mic-status-text').textContent = 'Microphone: Off';
      document.getElementById('mic-btn').classList.remove('active');
      document.getElementById('mic-btn').innerHTML = `
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
        </svg>
        Enable Microphone
      `;
    }

    // Synth voice for demo
    let synthOscillators = [];
    let synthGain = null;
    let usingSynthAudio = false;

    function createSynthVoice() {
      if (!audioContext) return;

      const masterGain = audioContext.createGain();
      masterGain.gain.value = 0;
      masterGain.connect(trackAnalyser);
      synthGain = masterGain;

      const frequencies = [120, 240, 360, 480, 600];
      frequencies.forEach((freq, i) => {
        const osc = audioContext.createOscillator();
        const oscGain = audioContext.createGain();
        osc.type = i === 0 ? 'sawtooth' : 'sine';
        osc.frequency.value = freq;
        oscGain.gain.value = 1 / (i + 1);
        osc.connect(oscGain);
        oscGain.connect(masterGain);
        osc.start();
        synthOscillators.push({ osc, gain: oscGain });
      });

      usingSynthAudio = true;
    }

    function animateSynthVoice() {
      if (!usingSynthAudio || !trackPlaying || !synthGain) return;

      const t = audioContext.currentTime;
      const speechPattern = Math.sin(t * 3) * 0.3 + Math.sin(t * 7) * 0.2 + Math.sin(t * 13) * 0.15 + Math.random() * 0.1;
      const volume = Math.max(0, Math.min(1, 0.3 + speechPattern * 0.4));
      synthGain.gain.setTargetAtTime(volume * 0.15, t, 0.05);

      synthOscillators.forEach((item, i) => {
        const baseFreq = [120, 240, 360, 480, 600][i];
        const variation = Math.sin(t * (2 + i)) * 10;
        item.osc.frequency.setTargetAtTime(baseFreq + variation, t, 0.1);
      });

      if (trackPlaying) {
        requestAnimationFrame(animateSynthVoice);
      }
    }

    function stopSynthVoice() {
      if (synthGain) {
        synthGain.gain.setTargetAtTime(0, audioContext.currentTime, 0.1);
      }
    }

    async function toggleTrack() {
      const audio = document.getElementById('agencer-audio');

      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }

      if (audioContext.state === 'suspended') {
        await audioContext.resume();
      }

      if (!trackAnalyser) {
        trackAnalyser = audioContext.createAnalyser();
        trackAnalyser.fftSize = 256;
        trackAnalyser.smoothingTimeConstant = 0.8;
        trackAnalyser.connect(audioContext.destination);
        trackData = new Uint8Array(trackAnalyser.frequencyBinCount);
      }

      const hasAudioSource = audio.src && audio.src !== window.location.href;

      if (!hasAudioSource && !usingSynthAudio) {
        createSynthVoice();
      }

      if (hasAudioSource && !audio._connected) {
        const trackSource = audioContext.createMediaElementSource(audio);
        trackSource.connect(trackAnalyser);
        audio._connected = true;
      }

      if (trackPlaying) {
        if (hasAudioSource) {
          audio.pause();
        } else {
          stopSynthVoice();
        }
        trackPlaying = false;
        document.getElementById('track-btn').innerHTML = `
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
          Play Agencer Voice
        `;
      } else {
        trackPlaying = true;
        if (hasAudioSource) {
          audio.play();
        } else {
          animateSynthVoice();
        }
        document.getElementById('track-btn').innerHTML = `
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="6" y="4" width="4" height="16"/>
            <rect x="14" y="4" width="4" height="16"/>
          </svg>
          Pause Agencer Voice
        `;
      }
    }

    function getAudioData() {
      const sensitivity = CONFIG.audioSensitivity;

      // Mic data - drives ring waveform
      if (micEnabled && micAnalyser) {
        micAnalyser.getByteFrequencyData(micData);

        // Smooth FFT for ring
        for (let i = 0; i < micData.length; i++) {
          const target = micData[i] / 255;
          smoothedMicFFT[i] = lerp(smoothedMicFFT[i], target, 0.2);
        }

        // Overall level
        let sum = 0;
        for (let i = 0; i < micData.length; i++) sum += micData[i];
        smoothedMicLevel = lerp(smoothedMicLevel, (sum / micData.length / 255) * sensitivity, 0.15);
      } else {
        smoothedMicLevel = lerp(smoothedMicLevel, 0, 0.05);
        for (let i = 0; i < smoothedMicFFT.length; i++) {
          smoothedMicFFT[i] = lerp(smoothedMicFFT[i], 0.5, 0.05); // Settle to center (no displacement)
        }
      }

      // Track data - drives particles
      if (trackPlaying && trackAnalyser) {
        trackAnalyser.getByteFrequencyData(trackData);

        // Smooth FFT
        for (let i = 0; i < trackData.length; i++) {
          const target = trackData[i] / 255;
          smoothedTrackFFT[i] = lerp(smoothedTrackFFT[i], target, 0.2);
        }

        // Bass level (for pulse)
        let bass = 0;
        for (let i = 0; i < 10; i++) bass += trackData[i];
        const bassLevel = (bass / 10 / 255) * sensitivity;

        // Calculate pulse factor with smoothing
        const targetPulse = 1 + bassLevel * 0.15;
        lastPulseFactor = lerp(lastPulseFactor, targetPulse, 0.1);

        // Overall level
        let sum = 0;
        for (let i = 0; i < trackData.length; i++) sum += trackData[i];
        smoothedTrackLevel = lerp(smoothedTrackLevel, (sum / trackData.length / 255) * sensitivity, 0.15);
      } else {
        smoothedTrackLevel = lerp(smoothedTrackLevel, 0, 0.05);
        lastPulseFactor = lerp(lastPulseFactor, 1, 0.05);
      }

      // Update meters
      document.getElementById('mic-meter').style.width = (smoothedMicLevel * 100) + '%';
      document.getElementById('track-meter').style.width = (smoothedTrackLevel * 100) + '%';
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    // ============================================
    // ANIMATION LOOP
    // ============================================

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      time += delta;

      // FPS counter
      frameCount++;
      if (time - lastFpsTime >= 1) {
        document.getElementById('fps').textContent = Math.round(frameCount / (time - lastFpsTime)) + ' FPS';
        frameCount = 0;
        lastFpsTime = time;
      }

      // Get audio data
      getAudioData();

      // Update particle uniforms
      particleMaterial.uniforms.uTime.value = time;
      particleMaterial.uniforms.uAudioLevel.value = smoothedTrackLevel;
      particleMaterial.uniforms.uBassLevel.value = lastPulseFactor - 1;
      particleMaterial.uniforms.uSize.value = CONFIG.particleSize;
      particleMaterial.uniforms.uBreathingIntensity.value = CONFIG.breathingIntensity;
      particleMaterial.uniforms.uDepthIntensity.value = CONFIG.depthIntensity;
      particleMaterial.uniforms.uPulseFactor.value = lastPulseFactor;

      // Update ring waveform
      updateRingWaveform();

      // Update bloom
      bloomPass.strength = CONFIG.bloomStrength;

      // Render
      composer.render();
    }

    // ============================================
    // CONTROLS
    // ============================================

    function setupControls() {
      // Logo upload
      document.getElementById('upload-logo-btn').addEventListener('click', () => {
        document.getElementById('logo-upload').click();
      });

      document.getElementById('logo-upload').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = async (event) => {
            await loadLogoFromImage(event.target.result);
          };
          reader.readAsDataURL(file);
        }
      });

      // Audio upload
      document.getElementById('upload-audio-btn').addEventListener('click', () => {
        document.getElementById('audio-upload').click();
      });

      document.getElementById('audio-upload').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          const audio = document.getElementById('agencer-audio');
          audio.src = URL.createObjectURL(file);
          audio._connected = false;
          usingSynthAudio = false;

          synthOscillators.forEach(item => {
            item.osc.stop();
            item.osc.disconnect();
          });
          synthOscillators = [];
          synthGain = null;

          if (trackAnalyser) {
            trackAnalyser.disconnect();
            trackAnalyser = null;
          }

          console.log('Audio loaded:', file.name);
        }
      });

      document.getElementById('agencer-audio').addEventListener('ended', () => {
        if (!document.getElementById('agencer-audio').loop) {
          trackPlaying = false;
          document.getElementById('track-btn').innerHTML = `
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="5 3 19 12 5 21 5 3"/>
            </svg>
            Play Agencer Voice
          `;
        }
      });

      document.getElementById('mic-btn').addEventListener('click', () => {
        micEnabled ? disableMicrophone() : enableMicrophone();
      });

      document.getElementById('track-btn').addEventListener('click', toggleTrack);

      // Sliders
      const sliders = [
        'particleCount', 'particleSize', 'breathingIntensity', 'depthIntensity',
        'waveAmplitude', 'audioSensitivity', 'bloomStrength'
      ];

      sliders.forEach(id => {
        const slider = document.getElementById(id);
        if (!slider) return;

        const valueDisplay = document.getElementById(id + '-val');

        slider.addEventListener('input', () => {
          const value = parseFloat(slider.value);
          CONFIG[id] = value;

          if (id === 'particleCount' || id === 'waveAmplitude') {
            valueDisplay.textContent = Math.round(value);
          } else {
            valueDisplay.textContent = value.toFixed(2);
          }

          if (id === 'particleCount') {
            clearTimeout(slider.rebuildTimeout);
            slider.rebuildTimeout = setTimeout(rebuildParticles, 500);
          }
        });
      });

      // Presets
      document.querySelectorAll('.preset-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const index = parseInt(btn.dataset.preset);
          loadPreset(index);
          document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
        });
      });

      document.getElementById('save-preset').addEventListener('click', () => {
        const btn = document.querySelector('.preset-btn.active');
        const index = btn ? parseInt(btn.dataset.preset) : 0;
        savePreset(index);
        alert(`Preset ${index + 1} saved!`);
      });

      document.getElementById('reset-defaults').addEventListener('click', () => {
        Object.assign(CONFIG, DEFAULTS);
        updateSlidersFromConfig();
      });

      document.getElementById('toggle-controls').addEventListener('click', () => {
        document.getElementById('controls').classList.remove('hidden');
      });

      // Keyboard
      document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return;
        switch(e.key.toLowerCase()) {
          case 'h':
            document.getElementById('controls').classList.toggle('hidden');
            break;
          case 'm':
            micEnabled ? disableMicrophone() : enableMicrophone();
            break;
          case ' ':
            e.preventDefault();
            toggleTrack();
            break;
          case 'r':
            Object.assign(CONFIG, DEFAULTS);
            updateSlidersFromConfig();
            break;
        }
      });

      loadSavedPresets();
    }

    function updateSlidersFromConfig() {
      const sliders = [
        'particleCount', 'particleSize', 'breathingIntensity', 'depthIntensity',
        'waveAmplitude', 'audioSensitivity', 'bloomStrength'
      ];

      sliders.forEach(id => {
        const slider = document.getElementById(id);
        if (!slider) return;

        const valueDisplay = document.getElementById(id + '-val');
        slider.value = CONFIG[id];

        if (id === 'particleCount' || id === 'waveAmplitude') {
          valueDisplay.textContent = Math.round(CONFIG[id]);
        } else {
          valueDisplay.textContent = CONFIG[id].toFixed(2);
        }
      });
    }

    function savePreset(index) {
      const presets = JSON.parse(localStorage.getItem('agencerAvatarPresets') || '{}');
      presets[index] = { ...CONFIG };
      localStorage.setItem('agencerAvatarPresets', JSON.stringify(presets));
    }

    function loadPreset(index) {
      const presets = JSON.parse(localStorage.getItem('agencerAvatarPresets') || '{}');
      if (presets[index]) {
        Object.assign(CONFIG, presets[index]);
        updateSlidersFromConfig();
        if (logoParticleData.length !== CONFIG.particleCount) {
          rebuildParticles();
        }
      }
    }

    function loadSavedPresets() {
      const lastPreset = localStorage.getItem('agencerAvatarLastPreset');
      if (lastPreset !== null) {
        loadPreset(parseInt(lastPreset));
        document.querySelector(`.preset-btn[data-preset="${lastPreset}"]`)?.classList.add('active');
      }
    }

    async function rebuildParticles() {
      scene.remove(particles);
      particleGeometry.dispose();
      particleMaterial.dispose();
      logoParticleData = generateProceduralLogoData();
      createParticles();
    }

    async function loadLogoFromImage(imageSrc) {
      const img = new Image();
      img.crossOrigin = 'anonymous';

      return new Promise((resolve) => {
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          const size = Math.min(img.width, img.height, 512);
          canvas.width = size;
          canvas.height = size;

          const scale = size / Math.max(img.width, img.height);
          const w = img.width * scale;
          const h = img.height * scale;
          const x = (size - w) / 2;
          const y = (size - h) / 2;

          ctx.drawImage(img, x, y, w, h);
          const imageData = ctx.getImageData(0, 0, size, size);
          const pixels = imageData.data;

          const candidates = [];
          const centerX = size / 2;
          const centerY = size / 2;

          for (let py = 0; py < size; py++) {
            for (let px = 0; px < size; px++) {
              const i = (py * size + px) * 4;
              const r = pixels[i];
              const g = pixels[i + 1];
              const b = pixels[i + 2];
              const a = pixels[i + 3];

              if (a < 50) continue;

              candidates.push({
                x: (px - centerX) / centerX,
                y: (centerY - py) / centerY,
                r: r / 255,
                g: g / 255,
                b: b / 255,
                phase: Math.random() * Math.PI * 2
              });
            }
          }

          const shuffled = candidates.sort(() => Math.random() - 0.5);
          logoParticleData = shuffled.slice(0, CONFIG.particleCount);

          scene.remove(particles);
          particleGeometry.dispose();
          particleMaterial.dispose();
          createParticles();

          console.log(`Loaded logo with ${logoParticleData.length} particles`);
          resolve();
        };

        img.onerror = () => {
          console.error('Failed to load logo');
          resolve();
        };

        img.src = imageSrc;
      });
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
      particleMaterial.uniforms.uPixelRatio.value = renderer.getPixelRatio();
    }

    // ============================================
    // INITIALIZE
    // ============================================

    init();

    window.agencerAvatar = {
      CONFIG,
      scene,
      camera,
      particles,
      ringLine,
      rebuildParticles
    };
  </script>
</body>
